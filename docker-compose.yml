services:
  postgres:
    image: postgres:16
    container_name: insightcart-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: insightcart
      POSTGRES_PASSWORD: insightcart
      POSTGRES_DB: insightcart
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U insightcart -d insightcart"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
